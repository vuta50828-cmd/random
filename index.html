
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>FF RANDOM SENSITIVITY</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

body {
  background: radial-gradient(circle at top, #451010, #080808 65%);
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 430px;
  background: #151515;
  border: 1px solid #ff3030;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 0 30px #ff202033;
}

h1 {
  text-align: center;
  color: #ff3939;
  font-size: 26px;
}

.sub {
  text-align: center;
  color: #999;
  font-size: 12px;
}

.device {
  background: #252525;
  border-radius: 12px;
  padding: 12px;
  margin: 20px 0;
}

select {
  width: 100%;
  background: #111;
  color: white;
  border: 1px solid #ff3939;
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  touch-action: manipulation;
}

.result {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  margin: 9px 0;
  background: #242424;
  border-left: 4px solid #ff3030;
  border-radius: 8px;
}

.result span:last-child {
  color: #ff4949;
  font-weight: bold;
  font-size: 19px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: #e82929;
  color: white;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

button:active {
  transform: scale(.97);
}

.copy {
  background: #333;
}

.footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="app">

<h1>FREE FIRE RANDOM</h1>
<div class="sub">SENSITIVITY GENERATOR</div>

<div class="device">
  <p>CHỌN THIẾT BỊ</p>

  <select id="device">
    <option value="145">iPhone XR</option>
    <option value="200">Android</option>
    <option value="200">iPhone khác</option>
  </select>
</div>

<div id="values">

  <div class="result">
    <span>Tổng quan</span><span>--</span>
  </div>

  <div class="result">
    <span>Red Dot</span><span>--</span>
  </div>

  <div class="result">
    <span>Ống ngắm 2X</span><span>--</span>
  </div>

  <div class="result">
    <span>Ống ngắm 4X</span><span>--</span>
  </div>

  <div class="result">
    <span>Ống ngắm súng ngắm</span><span>--</span>
  </div>

  <div class="result">
    <span>Nhìn xung quanh</span><span>--</span>
  </div>

</div>

<button id="randomBtn">RANDOM ĐỘ NHẠY</button>
<button class="copy" id="copyBtn">SAO CHÉP KẾT QUẢ</button>

<div class="footer">
  FF SENSITIVITY • FAN MADE
</div>

</div>

<script>
const names = [
  "Tổng quan",
  "Red Dot",
  "Ống ngắm 2X",
  "Ống ngắm 4X",
  "Ống ngắm súng ngắm",
  "Nhìn xung quanh"
];

const minimum = [110, 100, 90, 80, 50, 70];

let current = [];

function randomSensitivity() {
  const max = Number(
    document.getElementById("device").value
  );

  current = names.map((name, i) => {
    return Math.floor(
      Math.random() * (max - minimum[i] + 1)
    ) + minimum[i];
  });

  document.getElementById("values").innerHTML =
    names.map((name, i) => `
      <div class="result">
        <span>${name}</span>
        <span>${current[i]}</span>
      </div>
    `).join("");
}

async function copySensitivity() {
  if (current.length === 0) {
    alert("Hãy random độ nhạy trước!");
    return;
  }

  const text =
    "FREE FIRE SENSITIVITY\n\n" +
    names.map((name, i) =>
      name + ": " + current[i]
    ).join("\n");

  try {
    await navigator.clipboard.writeText(text);
    alert("Đã sao chép độ nhạy!");
  } catch (error) {
    alert("Không thể sao chép. Hãy thử trên HTTPS.");
  }
}

document.getElementById("randomBtn")
  .addEventListener("click", randomSensitivity);

document.getElementById("copyBtn")
  .addEventListener("click", copySensitivity);

// Chống zoom khi chạm 2 lần
document.addEventListener("dblclick", function(e) {
  e.preventDefault();
}, { passive: false });

// Chống thao tác pinch zoom
document.addEventListener("gesturestart", function(e) {
  e.preventDefault();
});

document.addEventListener("gesturechange", function(e) {
  e.preventDefault();
});

document.addEventListener("gestureend", function(e) {
  e.preventDefault();
});
</script>

</body>
</html>
